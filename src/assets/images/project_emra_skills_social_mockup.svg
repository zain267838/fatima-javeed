<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="EMRA Skills social media profile mockup">
  <defs>
    <linearGradient id="esPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4EC"/>
      <stop offset="1" stop-color="#F8C96B"/>
