    <!-- Post 1 -->
    <rect x="100" y="326" width="600" height="112" rx="16" fill="#FFFFFF" stroke="#EFE4D8" stroke-width="2"/>
    <circle cx="128" cy="352" r="13" fill="#043839"/>
    <text x="128" y="357" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF4EC" text-anchor="middle">EM</text>
    <text x="150" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#064F50">EMRA Skills</text>
