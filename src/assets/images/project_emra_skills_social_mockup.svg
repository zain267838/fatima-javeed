    <linearGradient id="esBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#043839"/>
      <stop offset="1" stop-color="#0B6865"/>
    </linearGradient>
    <clipPath id="esWin">
      <rect x="70" y="44" width="660" height="512" rx="30"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#esPage)"/>
  <circle cx="106" cy="86" r="70" fill="#B9E5DE" opacity="0.5"/>
  <circle cx="716" cy="534" r="86" fill="#F5A58C" opacity="0.3"/>

  <g clip-path="url(#esWin)">
    <rect x="70" y="44" width="660" height="512" fill="#FFFFFF"/>

    <!-- Top app bar -->
    <rect x="70" y="44" width="660" height="52" fill="#F7F3EF"/>
    <circle cx="104" cy="70" r="6" fill="#F5A58C"/>
    <circle cx="124" cy="70" r="6" fill="#F8C96B"/>
    <circle cx="144" cy="70" r="6" fill="#B9E5DE"/>
    <rect x="182" y="58" width="250" height="24" rx="12" fill="#FFFFFF"/>
    <circle cx="200" cy="70" r="6" fill="none" stroke="#0B6865" stroke-width="2"/>
    <line x1="204.5" y1="74.5" x2="209" y2="79" stroke="#0B6865" stroke-width="2" stroke-linecap="round"/>
    <rect x="620" y="60" width="86" height="20" rx="10" fill="#064F50"/>

    <!-- Cover banner -->
    <rect x="70" y="96" width="660" height="132" fill="url(#esBanner)"/>
    <path d="M596 118h96v96h-96z" fill="#F8C96B" opacity="0.16" transform="rotate(12 644 166)"/>
    <circle cx="660" cy="188" r="30" fill="#F5A58C" opacity="0.32"/>

    <!-- Avatar -->
    <circle cx="146" cy="252" r="52" fill="#F5A58C" stroke="#FFFFFF" stroke-width="8"/>
    <text x="146" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#043839" text-anchor="middle">EM</text>
    <circle cx="184" cy="292" r="13" fill="#F8C96B" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Brand name + handle -->
    <text x="218" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#064F50">EMRA Skills</text>
    <text x="218" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#7A6250">@emraskills  ·  Education &amp; Skills</text>

