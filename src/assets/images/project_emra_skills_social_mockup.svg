    <rect x="124" y="416" width="210" height="8" rx="4" fill="#F5A58C" opacity="0.5"/>
    <path d="M620 400c-4 0-7 3-7 6.5 0 4.5 7 10 7 10s7-5.5 7-10c0-3.5-3-6.5-7-6.5z" fill="#F5A58C"/>
    <path d="M572 398h18v11h-11l-5 4v-4h-2z" fill="none" stroke="#0B6865" stroke-width="2" stroke-linejoin="round"/>
    <path d="M664 402l6-5v4c6 0 9 3 9 9-2-3-5-4-9-4v4z" fill="none" stroke="#0B6865" stroke-width="2" stroke-linejoin="round"/>

    <!-- Post 2 -->
    <rect x="100" y="452" width="600" height="90" rx="16" fill="#FFFFFF" stroke="#EFE4D8" stroke-width="2"/>
    <circle cx="128" cy="478" r="13" fill="#0B6865"/>
    <text x="128" y="483" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF4EC" text-anchor="middle">EM</text>
    <text x="150" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#064F50">EMRA Skills</text>
    <text x="150" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9A8474">2d  ·  Career skills</text>
    <rect x="124" y="506" width="380" height="8" rx="4" fill="#064F50" opacity="0.18"/>
    <rect x="124" y="524" width="260" height="8" rx="4" fill="#064F50" opacity="0.11"/>
    <rect x="596" y="498" width="80" height="30" rx="15" fill="#064F50"/>
    <text x="636" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFF4EC" text-anchor="middle">Follow</text>
