  </defs>

  <rect width="800" height="600" fill="url(#erPage)"/>
  <circle cx="712" cy="78" r="74" fill="#F8C96B" opacity="0.4"/>
  <circle cx="86" cy="546" r="88" fill="#F5A58C" opacity="0.32"/>

