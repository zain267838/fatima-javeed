  <rect x="70" y="44" width="660" height="512" rx="30" fill="none" stroke="#064F50" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Platform badges -->
  <g>
    <rect x="628" y="516" width="88" height="34" rx="17" fill="#064F50" opacity="0.9"/>
    <text x="672" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF4EC" text-anchor="middle">in</text>
    <rect x="556" y="516" width="58" height="34" rx="17" fill="#FFFFFF" opacity="0.92"/>
    <text x="585" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#064F50" text-anchor="middle">f</text>
  </g>
