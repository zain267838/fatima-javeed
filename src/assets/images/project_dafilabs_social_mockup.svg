      <text x="234" y="296" font-weight="600">Followers</text>
      <rect x="328" y="278" width="86" height="26" rx="13" fill="#064F50" opacity="0.06"/>
      <text x="344" y="296" font-weight="600">Posts</text>
      <rect x="426" y="278" width="112" height="26" rx="13" fill="#064F50" opacity="0.06"/>
      <text x="442" y="296" font-weight="600">Engagement</text>
    </g>

    <!-- Post 1 -->
    <rect x="100" y="326" width="600" height="112" rx="16" fill="#FFFFFF" stroke="#E7E3DC" stroke-width="2"/>
    <circle cx="128" cy="352" r="13" fill="#064F50"/>
    <text x="128" y="357" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF4EC" text-anchor="middle">DL</text>
