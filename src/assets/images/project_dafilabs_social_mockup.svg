    <linearGradient id="dlBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#064F50"/>
      <stop offset="1" stop-color="#043839"/>
    </linearGradient>
    <clipPath id="dlWin">
      <rect x="70" y="44" width="660" height="512" rx="30"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#dlPage)"/>
  <circle cx="700" cy="500" r="96" fill="#F8C96B" opacity="0.35"/>
  <circle cx="104" cy="92" r="66" fill="#F5A58C" opacity="0.3"/>

  <g clip-path="url(#dlWin)">
    <rect x="70" y="44" width="660" height="512" fill="#FFFFFF"/>

    <!-- Top app bar -->
    <rect x="70" y="44" width="660" height="52" fill="#F3F1EE"/>
    <circle cx="104" cy="70" r="6" fill="#F5A58C"/>
    <circle cx="124" cy="70" r="6" fill="#F8C96B"/>
    <circle cx="144" cy="70" r="6" fill="#B9E5DE"/>
    <rect x="182" y="58" width="250" height="24" rx="12" fill="#FFFFFF"/>
    <circle cx="200" cy="70" r="6" fill="none" stroke="#0B6865" stroke-width="2"/>
    <line x1="204.5" y1="74.5" x2="209" y2="79" stroke="#0B6865" stroke-width="2" stroke-linecap="round"/>
    <rect x="620" y="60" width="86" height="20" rx="10" fill="#064F50"/>

    <!-- Cover banner -->
    <rect x="70" y="96" width="660" height="132" fill="url(#dlBanner)"/>
    <circle cx="622" cy="140" r="40" fill="#F8C96B" opacity="0.18"/>
    <rect x="560" y="180" width="130" height="10" rx="5" fill="#F5A58C" opacity="0.4"/>

    <!-- Avatar -->
    <circle cx="146" cy="252" r="52" fill="#F8C96B" stroke="#FFFFFF" stroke-width="8"/>
    <text x="146" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#043839" text-anchor="middle">DL</text>
    <circle cx="184" cy="292" r="13" fill="#B9E5DE" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Brand name + handle -->
    <text x="218" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#064F50">DafiLabs</text>
    <text x="218" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4E7A78">@DafiLabs  ·  Digital Product Studio</text>

